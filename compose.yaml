name: athenas
x-app: &app
  build: .
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql://athenas:example@db:5432/athenas_development
    TEST_DATABASE_URL: postgresql://athenas:example@db:5432/athenas_test
    OLLAMA_BASE_URL: http://ollama:11434
  volumes:
    - uploads:/rails/storage
    - mail:/rails/tmp/mail
  depends_on:
    db:
      condition: service_healthy
  init: true
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: athenas
      POSTGRES_PASSWORD: example
      POSTGRES_DB: athenas_development
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athenas -d athenas_development"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
  ollama:
    image: ollama/ollama:0.13.5
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
  web:
    <<: *app
    ports:
      - "127.0.0.1:3000:3000"
  worker:
    <<: *app
    command: bin/jobs
    environment:
      <<: *environment
      JOB_CONCURRENCY: "1"
    mem_limit: 2g
    cpus: 2
volumes:
  postgres:
  uploads:
  ollama:
  mail:
